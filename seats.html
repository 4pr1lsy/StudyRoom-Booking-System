<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>预约座位 · 晨读</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="topbar"><nav class="nav"><a class="brand" href="index.html">✦ 晨读 / StudySpace</a><div class="nav-links"><a href="index.html">首页</a><a href="seats.html" aria-current="page">预约座位</a><a href="records.html">我的预约</a></div><span id="user-label" class="user"></span><button id="logout-btn" class="button ghost small" hidden>退出</button></nav></header><div id="storage-warning" class="storage-warning" hidden></div>
<main class="container"><span class="eyebrow">BOOK A SEAT</span><h1>寻找你的自习座位</h1><p>开放时间 08:00—22:00，可预约今天及未来 7 天，按整点选择。</p><div class="grid-two"><section class="card"><h2>选择预约条件</h2><form id="booking-form"><div class="fields"><div class="field wide"><label for="room">自习室</label><select id="room"></select></div><div class="field wide"><label for="date">预约日期</label><input type="date" id="date" required></div><div class="field"><label for="start">开始时间</label><select id="start"></select></div><div class="field"><label for="end">结束时间</label><select id="end"></select></div></div><p class="hint" id="time-hint"></p><h3>已选座位</h3><div class="selection" id="selection">请先选择一个可预约座位</div><button type="submit" id="book-btn" class="button" disabled>确认预约</button></form></section><section class="card"><div class="section-title"><h2>座位分布</h2><span id="availability" class="hint"></span></div><div class="callout hint" style="text-align:center">窗边 ☀ · 安静学习区</div><div id="seat-grid" class="seat-grid" aria-label="座位选择"></div><div class="legend"><span><i class="dot free"></i>可预约</span><span><i class="dot busy"></i>不可预约</span><span><i class="dot chosen"></i>已选择</span></div><p class="hint">每个方块代表一个座位，选择后点击左侧“确认预约”。</p></section></div></main>
<footer class="footer">晨读自习室 · 软件项目管理实验 · V0.2</footer><div id="toast" role="status" aria-live="polite" class="toast"></div><script src="js/core.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script></body></html>
